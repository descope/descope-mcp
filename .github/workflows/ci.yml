name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            deps
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: |
          uv run --no-sync ruff format --check src/ tests/ examples/
          uv run --no-sync isort --check-only src/ tests/ examples/
      - name: Type check
        run: uv run --no-sync mypy src/

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run test suite
        run: uv run --no-sync pytest tests/ -v --cov=src/descope_mcp --cov-report=xml --cov-report=term
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}.${{ matrix.python }}
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage.${{ matrix.os }}.${{ matrix.python }}
          path: |
            python/.coverage.${{ matrix.os }}.${{ matrix.python }}
            python/coverage.xml
          if-no-files-found: error
          include-hidden-files: true

  coverage:
    name: Coverage
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # stores coverage data on the python-coverage-comment-action-data branch
      pull-requests: write # posts the coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage.*
          merge-multiple: true
          path: python
      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8 # v4.7
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true
          ANNOTATE_MISSING_LINES: true
          COVERAGE_PATH: python

  package:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: false
      # Mirrors the release workflow's build and verify steps exactly.
      - name: Build sdist and wheel
        working-directory: python
        run: uv build --out-dir ../dist
      - name: Check version files agree
        working-directory: python
        run: |
          project_version="$(uv version --short)"
          module_version="$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' src/descope_mcp/__init__.py)"
          echo "pyproject.toml: ${project_version}, __init__.py: ${module_version}"
          test "${project_version}" = "${module_version}"
          echo "PROJECT_VERSION=${project_version}" >> "${GITHUB_ENV}"
      - name: Verify distributions
        run: .github/scripts/verify-dist.sh dist "${PROJECT_VERSION}"

  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  gitleaks:
    name: Scan for secrets (gitleaks)
    # Fork PRs get no GITLEAKS_LICENSE, which gitleaks-action requires on org repos.
    # Push protection still covers them; `CI OK` treats this skip as a pass.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Single required status check for branch rulesets; add new gating jobs to `needs`.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - validate-pr-title
      - lint
      - test
      - package
      - zizmor
      - gitleaks
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<<"${RESULTS}" >/dev/null; then
            echo "::error::One or more required jobs failed or were cancelled"
            exit 1
          fi
